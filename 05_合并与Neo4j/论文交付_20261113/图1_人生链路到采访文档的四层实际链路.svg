<text x="40" y="820" font-size="11" fill="#6B7280">注：示例全部取自 6 份人工标注（WORKFLOW_DEMO / CONFIRMED，DEMO- 前缀）；54 份批量语料链路结构相同但状态为 MODEL_CANDIDATE，未混入本图。</text>
<text x="40" y="840" font-size="11" fill="#6B7280">站点按 normalized_start 排列，站间 BIOGRAPHICAL_NEXT 因省略中间站点未画出；「三访」出现在「二访」之前，反映历史时间而非访谈编号顺序。</text>
<text x="40" y="862" font-size="11" fill="#6B7280">全库 377 条「生平 → 事件 → 文档」链路零断链；逐字片段与证据挂接在本图中从略。</text>
