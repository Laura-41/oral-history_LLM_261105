<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>口述史图谱 · 交互原型</title>
<style>
:root{
  --paper:#F6F1E7; --surface:#FBF8F1; --surface2:#F1E9DA; --ink:#221E19;
  --muted:#6B6257; --faint:#9A9082; --seal:#973E31; --scroll:#EEE1C8;
  --line:rgba(34,30,25,.14); --line2:rgba(34,30,25,.28);
  --oral:#973E31; --editorial:#5A6B7A; --interviewer:#8A8172;
  --ok:#3F6B4F; --warn:#A8712A;
}
body.night{
  --paper:#1B1916; --surface:#23201C; --surface2:#2C2822; --ink:#EDE6D6;
  --muted:#ADA393; --faint:#7E766A; --seal:#C4634F; --scroll:#2E2A24;
  --line:rgba(237,230,214,.15); --line2:rgba(237,230,214,.3);
  --oral:#D0806B; --editorial:#8FA8BA; --interviewer:#A79E8E;
  --ok:#85B492; --warn:#D6A85E;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:13px; line-height:1.6;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.serif{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif}
.topbar{
  height:62px;display:flex;align-items:center;gap:24px;padding:0 22px;
  border-bottom:1px solid var(--line);background:var(--surface);
}
.brand{display:flex;align-items:center;gap:11px;min-width:210px}
.seal{
  width:34px;height:34px;background:var(--seal);color:#fff;border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  font-family:"STKaiti","Kaiti SC",serif;transform:rotate(-4deg);flex:none;
}
.brand-zh{font-size:16px;font-weight:600;letter-spacing:2px;line-height:1.2}
.brand-en{font-size:10px;color:var(--faint);letter-spacing:1.2px;margin-top:2px}
.tabs{display:flex;gap:4px;flex:1}
.tab{
  background:transparent;border:0;border-bottom:2px solid transparent;
  padding:19px 16px 17px;color:var(--muted);font-size:13px;letter-spacing:1px;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--seal);border-bottom-color:var(--seal);font-weight:600}
.topright{display:flex;align-items:center;gap:8px}
.scope-badge{
  font-size:11px;color:var(--muted);border:1px solid var(--line);
  padding:4px 9px;border-radius:20px;white-space:nowrap;
}
.ghost{
  background:transparent;border:1px solid var(--line2);border-radius:4px;
  padding:5px 11px;font-size:12px;color:var(--muted);white-space:nowrap;
}
.ghost:hover{border-color:var(--seal);color:var(--seal)}
.ghost.subtle{border-style:dashed}
.ghost.on{background:var(--seal);color:#fff;border-color:var(--seal)}
main{height:calc(100% - 62px - 30px);overflow:hidden}
.view{display:none;height:100%}
.view.active{display:block}
#view-trajectory.active{display:grid;grid-template-columns:224px minmax(0,1fr) 348px}
.panel{background:var(--surface);overflow-y:auto;height:100%}
.doclist{border-right:1px solid var(--line)}
.evidence-panel{border-left:1px solid var(--line)}
.panel-pad{padding:16px}
.traj-main{overflow-y:auto;height:100%;padding:18px 22px 40px}
.panel-title{
  font-size:11px;letter-spacing:2px;color:var(--faint);margin:0 0 12px;
  text-transform:uppercase;
}
.doc-group{margin-bottom:14px}
.doc-group-label{
  font-size:11px;color:var(--faint);padding:0 16px 5px;letter-spacing:1px;
}
.doc-item{
  display:block;width:100%;text-align:left;border:0;background:transparent;
  padding:9px 16px;border-left:3px solid transparent;color:var(--ink);
}
.doc-item:hover{background:var(--surface2)}
.doc-item.active{background:var(--surface2);border-left-color:var(--seal)}
.doc-item .t{font-size:13px;font-weight:500}
.doc-item .m{font-size:11px;color:var(--faint);margin-top:2px}
.doc-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.doc-head h1{font-size:23px;margin:0;font-weight:500;letter-spacing:1px}
.doc-head .sub{font-size:12px;color:var(--muted);margin-top:4px}
.meta-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;
  border:1px solid var(--line);border-radius:3px;padding:3px 8px;color:var(--muted);
  background:var(--surface);
}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.solid{border-color:var(--seal);color:var(--seal)}
.chip b{font-weight:600}
.askbar{display:flex;gap:8px;margin-bottom:8px}
.askbar input{
  flex:1;background:var(--surface);border:1px solid var(--line2);border-radius:4px;
  padding:9px 12px;outline:none;min-width:0;
}
.askbar input:focus{border-color:var(--seal)}
.askbar button{
  background:var(--seal);color:#fff;border:0;border-radius:4px;padding:0 18px;white-space:nowrap;
}
.ask-hint{font-size:11px;color:var(--faint);margin-bottom:12px}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;min-height:0}
.slot{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface2);
  border:1px solid var(--line);border-radius:20px;padding:3px 6px 3px 10px;font-size:11px;
}
.slot .k{color:var(--faint)}
.slot button{border:0;background:transparent;color:var(--faint);font-size:13px;line-height:1;padding:0 2px}
.slot button:hover{color:var(--seal)}
.query-echo{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
  color:var(--faint);background:var(--surface2);border-radius:3px;padding:5px 9px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.orderbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:9px 0;margin-bottom:14px;flex-wrap:wrap;
}
.order-tabs{display:flex;gap:4px}
.order-tabs button{
  background:transparent;border:1px solid transparent;border-radius:3px;
  padding:5px 13px;font-size:12px;color:var(--muted);
}
.order-tabs button.active{background:var(--seal);color:#fff}
.order-tools{display:flex;align-items:center;gap:10px}
.order-hint{font-size:11px;color:var(--faint)}
.bump-wrap{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:10px 14px;margin-bottom:14px}
.bump-wrap[hidden]{display:none}
.bump-head{font-size:11px;color:var(--muted);margin-bottom:4px}
.event-track{position:relative;padding-left:20px}
.event-track:before{
  content:'';position:absolute;left:5px;top:14px;bottom:14px;width:1px;background:var(--line2);
}
.event-card{
  position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:5px;padding:12px 15px;margin-bottom:10px;cursor:pointer;
  transition:border-color .15s,transform .15s;
}
.event-card:hover{border-color:var(--seal);transform:translateX(2px)}
.event-card.selected{border-color:var(--seal);box-shadow:inset 3px 0 0 var(--seal)}
.event-card.backjump{border-left:3px solid var(--seal)}
.event-card:before{
  content:'';position:absolute;left:-19px;top:20px;width:9px;height:9px;
  border-radius:50%;background:var(--surface);border:2px solid var(--line2);
}
.event-card.selected:before,.event-card.backjump:before{background:var(--seal);border-color:var(--seal)}
.ec-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ec-name{font-size:14px;font-weight:500;line-height:1.45}
.ec-orders{font-size:10.5px;color:var(--faint);white-space:nowrap;margin-top:3px}
.ec-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.ec-back{margin-top:7px;font-size:11.5px;color:var(--seal);line-height:1.5}
.ec-back:before{content:'↩ ';font-size:13px}
.badge{font-size:10.5px;border-radius:2px;padding:1px 6px;border:1px solid var(--line);color:var(--muted)}
.badge.oral{color:var(--oral);border-color:var(--oral)}
.badge.editorial{color:var(--editorial);border-color:var(--editorial)}
.badge.interviewer{color:var(--interviewer);border-color:var(--interviewer)}
.badge.confirmed{color:var(--ok);border-color:var(--ok)}
.badge.candidate{color:var(--warn);border-color:var(--warn)}
.badge.review{color:var(--seal);border-color:var(--seal)}
.empty{padding:26px 14px;color:var(--faint);font-size:12px;text-align:center}
.ev-head{padding:16px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.ev-head h2{font-size:15px;margin:0 0 6px;font-weight:500;line-height:1.5}
.ev-body{padding:14px 16px 40px}
.ev-sec{margin-bottom:18px}
.ev-sec h3{
  font-size:11px;letter-spacing:1.5px;color:var(--faint);margin:0 0 8px;
  border-bottom:1px solid var(--line);padding-bottom:5px;font-weight:500;
}
.ev-text{font-size:12.5px;line-height:1.75;color:var(--ink)}
.ev-muted{font-size:11.5px;color:var(--muted);line-height:1.7}
.kv{display:grid;grid-template-columns:70px 1fr;gap:5px 8px;font-size:12px}
.kv .k{color:var(--faint)}
.stage-chain{border-left:2px solid var(--scroll);padding-left:12px;margin-left:3px}
.stage-item{position:relative;padding:0 0 12px}
.stage-item:last-child{padding-bottom:0}
.stage-item:before{
  content:'';position:absolute;left:-17px;top:6px;width:7px;height:7px;
  border-radius:50%;background:var(--scroll);border:1px solid var(--line2);
}
.stage-item .sn{font-size:10.5px;color:var(--faint)}
.stage-item .ss{font-size:12.5px;font-weight:500}
.stage-item .sp{font-size:11.5px;color:var(--muted)}
.quote{
  background:var(--surface2);border-left:2px solid var(--scroll);
  padding:9px 11px;margin-bottom:8px;border-radius:0 3px 3px 0;font-size:12.5px;line-height:1.8;
}
.quote .qh{font-size:10.5px;color:var(--faint);margin-bottom:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.quote mark{background:rgba(151,62,49,.16);color:inherit;padding:0 1px;border-radius:2px}
body.night .quote mark{background:rgba(196,99,79,.28)}
.quote-body{max-height:150px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.mini-link{font-size:11px;color:var(--seal);background:transparent;border:0;padding:0;text-decoration:underline}
#view-cross.active,#view-evidence.active,#view-research.active{display:flex;flex-direction:column}
.cross-head{padding:14px 22px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.facet-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.facet-tabs button{
  background:transparent;border:1px solid var(--line2);border-radius:3px;
  padding:5px 12px;font-size:12px;color:var(--muted);
}
.facet-tabs button.active{background:var(--seal);color:#fff;border-color:var(--seal)}
.cross-filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cross-filters label{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.cross-filters select{
  background:var(--surface);border:1px solid var(--line2);border-radius:3px;padding:3px 7px;font-size:11.5px;
}
.cross-body{display:grid;grid-template-columns:250px minmax(0,1fr);flex:1;min-height:0}
.facet-list{border-right:1px solid var(--line)}
.facet-results{overflow-y:auto;padding:16px 22px 40px}
.facet-item{
  display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;
  background:transparent;padding:8px 14px;color:var(--ink);font-size:12.5px;
}
.facet-item:hover{background:var(--surface2)}
.facet-item.active{background:var(--surface2);border-left-color:var(--seal)}
.facet-item .cnt{float:right;color:var(--faint);font-size:11px}
.facet-item .sub{display:block;font-size:10.5px;color:var(--faint)}
.result-group{margin-bottom:22px}
.result-group h3{
  font-size:12px;font-weight:500;color:var(--seal);margin:0 0 9px;
  padding-bottom:6px;border-bottom:1px solid var(--line);letter-spacing:.5px;
}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:9px}
.result-card{
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:10px 12px;cursor:pointer;
}
.result-card:hover{border-color:var(--seal)}
.result-card .rt{font-size:12.5px;font-weight:500;line-height:1.5}
.result-card .rm{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:13px 15px}
.stat-card .n{font-size:24px;font-weight:500;line-height:1.2}
.stat-card .l{font-size:11.5px;color:var(--muted);margin-top:4px}
.evidence-view-body,.research-body{overflow-y:auto;padding:20px 24px 50px;flex:1}
.section{
  background:var(--surface);border:1px solid var(--line);border-radius:5px;
  padding:16px 18px;margin-bottom:16px;
}
.section h2{font-size:15px;font-weight:500;margin:0 0 10px;letter-spacing:.5px}
.section p{font-size:12.5px;color:var(--muted);margin:0 0 9px;line-height:1.8}
.section ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted);line-height:1.9}
.note-line{border-left:3px solid var(--seal);padding:6px 0 6px 12px;color:var(--seal);font-size:12px;margin-bottom:14px;line-height:1.8}
.seg-browser{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-top:12px}
.seg-list{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:4px}
.seg-row{
  display:block;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--line);padding:7px 11px;font-size:12px;
}
.seg-row:hover,.seg-row.active{background:var(--surface2)}
.seg-row .sid{font-size:10px;color:var(--faint);margin-right:7px}
.seg-row .stxt{color:var(--ink)}
.seg-detail{border:1px solid var(--line);border-radius:4px;padding:12px;font-size:12px;background:var(--surface2)}
.review-row{
  display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line);font-size:12px;
}
.review-row:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--faint);font-weight:500;font-size:11px;white-space:nowrap}
td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.research-banner{
  background:var(--surface2);border:1px dashed var(--seal);color:var(--seal);
  padding:9px 13px;border-radius:4px;font-size:12px;margin-bottom:16px;
}
.footer{
  height:30px;border-top:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;font-size:10.5px;color:var(--faint);
  background:var(--surface);
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
@media(max-width:1180px){
  #view-trajectory.active{grid-template-columns:190px minmax(0,1fr) 300px}
  .cross-body{grid-template-columns:210px minmax(0,1fr)}
}
@media(max-width:900px){
  #view-trajectory.active{grid-template-columns:1fr;height:auto}
  .doclist,.evidence-panel{height:auto;max-height:260px}
  .traj-main{height:auto}
  main{height:auto;overflow:visible}
  .topbar{flex-wrap:wrap;height:auto;padding:10px 14px;gap:10px}
  .seg-browser{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="seal">述</div>
    <div><div class="brand-zh serif">口述史图谱</div><div class="brand-en">ORAL HISTORY GRAPH · PROTOTYPE</div></div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="trajectory">单人轨迹</button>
    <button class="tab" data-view="cross">交叉档案</button>
    <button class="tab" data-view="evidence">证据与裁决</button>
  </nav>
  <div class="topright">
    <span class="scope-badge">6 份人工标注 · 词表 v1.0</span>
    <button class="ghost" id="themeBtn">熄灯夜读</button>
    <button class="ghost subtle" id="researchBtn">研究视图</button>
  </div>
</header>

<main>
  <section class="view active" id="view-trajectory">
    <aside class="panel doclist"><div class="panel-pad" id="docList"></div></aside>
    <div class="traj-main">
      <div class="doc-head" id="docHead"></div>
      <div class="askbar">
        <input id="askInput" placeholder="用一句话提问，例如：陈海峰 1931 到 1937 年在上海的事">
        <button id="askBtn">检索</button>
      </div>
      <div class="ask-hint">问句会被编译为受约束的查询条件并返回逐字证据，不生成自然语言结论。预设：陈海峰 1931 到 1937 年在上海的事 / 陈锐霆 参军 / 杨永松 平型关 / 待复核 的实体</div>
      <div class="slots" id="slots"></div>
      <div id="askResults" class="ask-results"></div>
      <div class="orderbar">
        <div class="order-tabs">
          <button class="active" data-order="historical">历史序</button>
          <button data-order="narrative">叙述序</button>
        </div>
        <div class="order-tools">
          <span class="order-hint" id="orderHint"></span>
          <button class="ghost" id="bumpBtn">双序对照</button>
        </div>
      </div>
      <div class="bump-wrap" id="bumpWrap" hidden>
        <div class="bump-head">左轴「讲」＝原文讲述位次，右轴「史」＝历史发生位次；朱红连线为讲述时回补的更早经历。连线只表示顺序差异，不代表关系强度。</div>
        <svg id="bumpSvg" width="100%" role="img" aria-label="叙述序与历史序对照斜线图"></svg>
      </div>
      <div class="event-track" id="eventTrack"></div>
    </div>
    <aside class="panel evidence-panel" id="evidencePanel"></aside>
  </section>

  <section class="view" id="view-cross">
    <div class="cross-head">
      <div class="facet-tabs" id="facetTabs"></div>
      <div class="cross-filters">
        <label>资料性质
          <select id="sourceFilter">
            <option value="">全部</option>
            <option value="ORAL_TESTIMONY">仅口述原话</option>
            <option value="EDITORIAL_PROFILE">仅编者小传</option>
            <option value="EDITORIAL_NOTE">仅编者注释</option>
          </select>
        </label>
        <div class="query-echo" id="queryEcho">query({}) — 与单人轨迹的问句共用同一查询层</div>
      </div>
    </div>
    <div class="cross-body">
      <aside class="panel facet-list"><div class="panel-pad" id="facetList"></div></aside>
      <div class="facet-results" id="facetResults"></div>
    </div>
  </section>

  <section class="view" id="view-evidence">
    <div class="evidence-view-body" id="evidenceViewBody"></div>
  </section>

  <section class="view" id="view-research">
    <div class="research-body" id="researchBody"></div>
  </section>
</main>

<footer class="footer">
  <span id="footerLeft">口述史图谱交互原型 · 数据来自 6 份人工标注 Demo</span>
  <span>逐字保真 · 不确定性可见 · 候选与放行分离</span>
</footer>

<script>/*__DATA__*/</script>
<script>
(function(){
'use strict';
var $ = function(s,r){return (r||document).querySelector(s);};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function group(arr,key){var m={};arr.forEach(function(r){var k=typeof key==='function'?key(r):r[key];(m[k]=m[k]||[]).push(r);});return m;}
function index(arr,key){var m={};arr.forEach(function(r){m[r[key]]=r;});return m;}
function uniq(a){return Array.from(new Set(a));}

var I={
  docById:index(DB.docs,'doc_id'),
  eventsByDoc:group(DB.events,'doc_id'),
  timesByEvent:group(DB.times,'event_id'),
  stagesByEvent:group(DB.stages,'event_id'),
  circByEvent:group(DB.circumstances,'event_id'),
  partByEvent:group(DB.participants,'event_id'),

/* ---------- 共用查询层：A 的问句、B 的切面、C 的证据都走这里 ---------- */
function eventDoc(e){return I.docById[e.doc_id]||{};}
function eventYears(e){
  return (I.timesByEvent[e.event_id]||[]).map(function(t){return (t.normalized_start||'').slice(0,4);})
    .filter(function(y){return /^\d{4}$/.test(y);});
}
function eventSegments(e){
  var ids={};(I.attachByTarget['EVENT:'+e.event_id]||[]).forEach(function(a){ids[a.segment_id]=1;});
  (I.timesByEvent[e.event_id]||[]).forEach(function(t){if(t.evidence_segment_id)ids[t.evidence_segment_id]=1;});
  (I.circByEvent[e.event_id]||[]).forEach(function(c){if(c.evidence_segment_id)ids[c.evidence_segment_id]=1;});
  (I.partByEvent[e.event_id]||[]).forEach(function(p){if(p.evidence_segment_id)ids[p.evidence_segment_id]=1;});
  (I.stagesByEvent[e.event_id]||[]).forEach(function(st){
    (I.attachByTarget['STAGE:'+st.stage_id]||[]).forEach(function(a){ids[a.segment_id]=1;});
  });
  return Object.keys(ids).map(function(id){return I.segmentById[id];}).filter(Boolean)
    .sort(function(a,b){return (+a.segment_order||0)-(+b.segment_order||0);});
}
function eventSourceStatuses(e){
  var ss=[];
  (I.timesByEvent[e.event_id]||[]).forEach(function(t){if(t.source_status)ss.push(t.source_status);});
  eventSegments(e).forEach(function(s){if(s.speaker_type==='INTERVIEWEE')ss.push('ORAL_TESTIMONY');});
  return uniq(ss);
}
function entityLabel(id){
  var en=I.entityById[id];
  if(en)return en.canonical_name;
  return id||'';
}
function facetKeyFor(e,facet,value){
  if(facet==='time')return eventYears(e).some(function(y){return y===value;});
  if(facet==='place')return (I.circByEvent[e.event_id]||[]).some(function(c){
    return c.kind==='LOCATION'&&(c.entity_id||c.value_text)===value;});
  if(facet==='org')return (I.partByEvent[e.event_id]||[]).some(function(p){
    return ['MILITARY_UNIT','ORGANIZATION'].indexOf(p.entity_type)>=0&&p.entity_id===value;});
  if(facet==='person')return (I.partByEvent[e.event_id]||[]).some(function(p){return p.entity_type==='PERSON'&&p.entity_id===value;});
  if(facet==='segment')return (I.attachByTarget['EVENT:'+e.event_id]||[]).some(function(a){return a.segment_id===value;});
  if(facet==='narrator'){
    var d=eventDoc(e);
    if(value==='INTERVIEWEE')return eventSegments(e).some(function(s){return s.speaker_type==='INTERVIEWEE';});
    if(value==='EDITOR')return eventSegments(e).some(function(s){return s.speaker_type==='EDITOR';});
    return eventSegments(e).some(function(s){return s.speaker_type==='INTERVIEWER';});
  }
  return false;
}
function query(f){
  f=f||{};
  return DB.events.filter(function(e){
    if(f.docId&&e.doc_id!==f.docId)return false;
    if(f.person&&eventDoc(e).interviewee!==f.person)return false;
    if(f.years&&f.years.length){
      var ys=eventYears(e);
      if(!ys.length)return false;
      if(!ys.some(function(y){return f.years.indexOf(y)>=0;}))return false;
    }
    var hasEntity=f.entityIds&&f.entityIds.length,hasKeyword=f.keywords&&f.keywords.length;
    if(hasEntity||hasKeyword){
      var ids=[];
      (I.circByEvent[e.event_id]||[]).forEach(function(c){if(c.entity_id)ids.push(c.entity_id);});
      (I.partByEvent[e.event_id]||[]).forEach(function(p){if(p.entity_id)ids.push(p.entity_id);});
      var hay=[e.event_name,e.result_state,e.boundary_note||''].join(' ');
      (I.circByEvent[e.event_id]||[]).forEach(function(c){hay+=' '+c.value_text+' '+entityLabel(c.entity_id);});
      (I.partByEvent[e.event_id]||[]).forEach(function(p){hay+=' '+p.entity_name;});
      var okEntity=hasEntity&&f.entityIds.some(function(id){return ids.indexOf(id)>=0;});
      var okKeyword=hasKeyword&&f.keywords.some(function(k){return hay.indexOf(k)>=0;});
      if(!(okEntity||okKeyword))return false;
    }
    if(f.sourceStatus){
      var ss=eventSourceStatuses(e);
      if(ss.indexOf(f.sourceStatus)<0)return false;
    }
    if(f.reviewStatus&&e.review_status!==f.reviewStatus)return false;
    if(f.facet&&f.facetValue!==null&&f.facetValue!==undefined){
      if(!facetKeyFor(e,f.facet,f.facetValue))return false;
    }
    return true;
  }).sort(function(a,b){
    var k=S.order==='narrative'?'narrative_order':'historical_order';
    return (+a[k]||0)-(+b[k]||0);
  });
}
function echoQuery(f){
  var parts=[];
  Object.keys(f).forEach(function(k){
    if(f[k]===null||f[k]===undefined||f[k]===''||(Array.isArray(f[k])&&!f[k].length))return;
    parts.push(k+': '+JSON.stringify(f[k]));
  });
  return 'query({ '+parts.join(', ')+' })';
}

function highlighted(seg){
  var text=seg.verbatim_text||'',ranges=[];
  (I.exprBySegment[seg.segment_id]||[]).forEach(function(x){
    var a=+x.start_offset,b=+x.end_offset;if(b>a&&b<=text.length)ranges.push([a,b,'t']);
  });
  ranges.sort(function(a,b){return a[0]-b[0];});
  var merged=[];
  ranges.forEach(function(r){
    if(merged.length&&r[0]<=merged[merged.length-1][1])merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],r[1]);
    else merged.push(r.slice());
  });
  var out='',pos=0;
  merged.forEach(function(r){
    out+=esc(text.slice(pos,r[0]))+'<mark>'+esc(text.slice(r[0],r[1]))+'</mark>';pos=r[1];
  });
  out+=esc(text.slice(pos));
  return out;
}

/* ---------- 自然语言问句 → 受约束槽位 ---------- */
function buildEntityVocab(){
  var v=[];
  DB.entities.forEach(function(e){
    if(e.canonical_name&&e.canonical_name.length>=2)v.push({text:e.canonical_name,id:e.entity_id});
  });
  DB.aliases.forEach(function(a){
    if(a.alias_text&&a.alias_text.length>=2)v.push({text:a.alias_text,id:a.entity_id});
  });
  return v.sort(function(a,b){return b.text.length-a.text.length;});
}
var VOCAB=buildEntityVocab();
function parseQuestion(q){
  var f={},slots=[],rest=q;
  DB.docs.forEach(function(d){
    if(q.indexOf(d.interviewee)>=0){f.person=d.interviewee;slots.push({k:'人物',v:d.interviewee});rest=rest.split(d.interviewee).join(' ');}
  });
  var range=q.match(/(\d{4})\s*(?:-|—|~|到|至|至)\s*(\d{4})/);
  var years=[];
  if(range){
    for(var y=+range[1];y<=+range[2];y++)years.push(String(y));
    rest=rest.replace(range[0],' ');
    slots.push({k:'时间',v:range[1]+'–'+range[2]});
  }else{
    var ys=q.match(/\d{4}/g)||[];
    if(ys.length){years=ys;slots.push({k:'时间',v:ys.join('、')});ys.forEach(function(y){rest=rest.split(y).join(' ');});}
  }
  if(years.length)f.years=years;
  var ss=null;
  [['ORAL_TESTIMONY',['口述','亲口','受访者']],['EDITORIAL_PROFILE',['编者','小传']],['NEEDS_REVIEW',['待复核','待裁决']]].forEach(function(p){
    if(!ss&&p[1].some(function(w){return q.indexOf(w)>=0;}))ss=p[0];
  });
  if(ss){
    if(ss==='NEEDS_REVIEW'){f.reviewStatus='NEEDS_REVIEW';slots.push({k:'状态',v:'待复核'});}
    else{f.sourceStatus=ss;slots.push({k:'资料性质',v:ss});}
  }
  var ids=[],hit=[];
  VOCAB.forEach(function(v){
    if(ids.length>=4)return;
    if(q.indexOf(v.text)>=0&&hit.indexOf(v.text)<0){
      hit.push(v.text);if(ids.indexOf(v.id)<0)ids.push(v.id);
    }
  });
  if(ids.length){f.entityIds=ids;slots.push({k:'实体',v:hit.slice(0,4).join('、')});hit.forEach(function(t){rest=rest.split(t).join(' ');});}
  var kws=rest.replace(/[的在了和与及到从是时候期年月份中前后以后关于请查问找哪些什么、，。？?！!\s]/g,' ')
    .split(/\s+/).filter(function(w){return w.length>=2&&!/^\d+$/.test(w);}).slice(0,3);
  if(kws.length){f.keywords=kws;slots.push({k:'关键词',v:kws.join('、')});}
  return {f:f,slots:slots};
}
var SLOT_KEY={'人物':'person','时间':'years','资料性质':'sourceStatus','状态':'reviewStatus','实体':'entityIds','关键词':'keywords'};

/* ---------- B 交叉档案 ---------- */
var FACETS=[
  {k:'time',label:'同一时间'},
  {k:'place',label:'同一地点'},
  {k:'org',label:'同一军队 / 组织'},
  {k:'person',label:'同一人物共现'},
  {k:'segment',label:'同一逐字片段'},
  {k:'narrator',label:'谁在讲谁'}
];
function facetValues(k){
  var m={};
  function add(key,label,sub){if(!key)return;var o=m[key]=m[key]||{key:key,label:label||key,sub:sub||'',events:{}};}
  DB.events.forEach(function(e){
    if(k==='time')eventYears(e).forEach(function(y){add(y,y,'年份');m[y].events[e.event_id]=1;});
    if(k==='place')(I.circByEvent[e.event_id]||[]).forEach(function(c){
      if(c.kind!=='LOCATION')return;var key=c.entity_id||c.value_text;if(!key)return;
      add(key,c.value_text||entityLabel(c.entity_id),entityLabel(c.entity_id));m[key].events[e.event_id]=1;});
    if(k==='org')(I.partByEvent[e.event_id]||[]).forEach(function(p){
      if(['MILITARY_UNIT','ORGANIZATION'].indexOf(p.entity_type)<0||!p.entity_id)return;
      add(p.entity_id,p.entity_name||entityLabel(p.entity_id),p.entity_type==='MILITARY_UNIT'?'部队':'组织');
      m[p.entity_id].events[e.event_id]=1;});
    if(k==='person')(I.partByEvent[e.event_id]||[]).forEach(function(p){
      if(p.entity_type!=='PERSON'||!p.entity_id)return;
      add(p.entity_id,p.entity_name||entityLabel(p.entity_id),'人物');m[p.entity_id].events[e.event_id]=1;});
    if(k==='segment')(I.attachByTarget['EVENT:'+e.event_id]||[]).forEach(function(a){
      var seg=I.segmentById[a.segment_id];if(!seg)return;
      add(a.segment_id,(seg.verbatim_text||'').slice(0,20)+'…',seg.speaker_type||'');
      m[a.segment_id].events[e.event_id]=1;});
    if(k==='narrator')eventSegments(e).forEach(function(s){
      var key=s.speaker_type||'OTHER';
      var labels={INTERVIEWEE:'受访者原话',EDITOR:'编者文字',INTERVIEWER:'访谈提问'};
      add(key,labels[key]||key,'逐字片段讲述者');m[key].events[e.event_id]=1;});
  });
  return Object.keys(m).map(function(key){
    var o=m[key];o.count=Object.keys(o.events).length;delete o.events;return o;
  }).sort(function(a,b){return b.count-a.count||a.label.localeCompare(b.label,'zh');});
}

  $$('[data-cross]').forEach(function(c){c.onclick=function(){
    var e=DB.events.filter(function(x){return x.event_id===c.dataset.cross;})[0];

};
$$('.order-tabs button').forEach(function(b){b.onclick=function(){
  S.order=b.dataset.order;
  $$('.order-tabs button').forEach(function(x){x.classList.toggle('active',x===b);});
  renderTrajectory();
};});
$('#bumpBtn').onclick=function(){
  var w=$('#bumpWrap');w.hidden=!w.hidden;
  $('#bumpBtn').textContent=w.hidden?'双序对照':'收起对照';
  if(!w.hidden)renderBump();
};
$('#askBtn').onclick=runAsk;
$('#askInput').addEventListener('keydown',function(ev){if(ev.key==='Enter')runAsk();});
$('#sourceFilter').onchange=function(){S.sourceStatus=this.value;renderCross();};
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&S.view==='research')switchView('trajectory');
});
try{if(localStorage.getItem('ohg-theme')==='night')$('#themeBtn').click();}catch(e){}

$('#footerLeft').textContent='口述史图谱交互原型 · 6 份人工标注 · 40 事件 / '
  +DB.segments.length+' 逐字片段 / '+DB.attachments.length+' 挂接 · 生成于 '+DB.meta.generated_at;
renderTrajectory();renderEvidencePanel(null);
window.OHG={S:S,DB:DB,query:query,switchView:switchView,parseQuestion:parseQuestion,
  renderTrajectory:renderTrajectory,renderCross:renderCross,renderEvidenceView:renderEvidenceView,
  renderResearch:renderResearch,renderEvidencePanel:renderEvidencePanel,echoQuery:echoQuery};
var vm=location.search.match(/view=(trajectory|cross|evidence|research)/);
if(vm)switchView(vm[1]);
})();
</script>
</body>
</html>
