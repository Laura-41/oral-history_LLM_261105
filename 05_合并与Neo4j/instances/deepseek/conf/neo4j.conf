# 正式语料 Qwen 线专用 Neo4j 实例
# 与 6 份人工 Demo（7474/7687）、DeepSeek 线（7486/7689）完全分离
# 7475 被 baidunetd 占用，故本实例改用 7486
initial.dbms.default_database=neo4j
dbms.security.auth_enabled=false

# 通过英文软链访问工程内真实目录，绕开中文路径转义
server.directories.data=/tmp/graph_deepseek/data
server.directories.logs=/tmp/graph_deepseek/logs
server.directories.run=/tmp/graph_deepseek/run
server.directories.import=/tmp/graph_deepseek/import
server.directories.transaction.logs.root=/tmp/graph_deepseek/data/transactions

server.bolt.enabled=true
server.bolt.listen_address=127.0.0.1:7689
server.bolt.advertised_address=127.0.0.1:7689

server.http.enabled=true
server.http.listen_address=127.0.0.1:7486
server.http.advertised_address=127.0.0.1:7486

server.https.enabled=false

server.memory.heap.initial_size=256m
server.memory.heap.max_size=768m
server.memory.pagecache.size=256m
